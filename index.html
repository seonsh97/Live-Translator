<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c1116">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Live Translator">
<title>Live Translator</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/variable/pretendardvariable-dynamic-subset.min.css">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500&family=IBM+Plex+Mono:wght@500&display=swap">
<style>
/* Layout: one-screen app. Header (status + tabs) / pane (live cards or call history) / thumb dock */
:root {
  --bg: #0c1116;
  --surface: #141b22;
  --raise: #1c252e;
  --line: #27313b;
  --fg: #f1f5f8;
  --muted: #8796a3;
  --accent: #5ad1c0;
  --live: #ff6d5a;
  --ai: #b3a6ff;
  --ko-font: "Pretendard Variable", Pretendard, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --en-font: "IBM Plex Sans", -apple-system, system-ui, sans-serif;
  --mono: "IBM Plex Mono", ui-monospace, monospace;
  --size: 21px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f6f8; --surface: #ffffff; --raise: #eef2f5; --line: #dbe2e7; --fg: #111b24;
    --muted: #5f6f7c; --accent: #0e8a79; --live: #d8432f; --ai: #6a55e0; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f6f8; --surface: #ffffff; --raise: #eef2f5; --line: #dbe2e7; --fg: #111b24;
  --muted: #5f6f7c; --accent: #0e8a79; --live: #d8432f; --ai: #6a55e0; color-scheme: light;
}
* { box-sizing: border-box; }
[hidden] { display: none !important; }
html, body { height: 100%; margin: 0; }
body {
  background: var(--bg); color: var(--fg); font-family: var(--ko-font);
  display: flex; flex-direction: column; overflow: hidden;
  padding-top: env(safe-area-inset-top, 0px);
  -webkit-tap-highlight-color: transparent; -webkit-text-size-adjust: 100%;
}
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; }
button:focus-visible, select:focus-visible, input:focus-visible, textarea:focus-visible, a:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

/* header */
header { padding: 10px 16px 0; display: flex; flex-direction: column; gap: 10px; border-bottom: 1px solid var(--line); }
.top { display: flex; align-items: center; gap: 10px; }
.brand { font: 600 17px var(--ko-font); letter-spacing: -.01em; }
.status { display: flex; align-items: center; gap: 6px; font: 500 11px var(--mono); letter-spacing: .06em; text-transform: uppercase; color: var(--muted); flex: 1; min-width: 0; }
.status span:last-child { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); flex: none; }
.dot.on { background: var(--live); animation: pulse 1.4s ease-in-out infinite; }
@keyframes pulse { 50% { opacity: .3; } }
.icon-btn { width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center; flex: none; }
.icon-btn svg, .side svg, #mic svg, .back svg { stroke: currentColor; fill: none; stroke-width: 1.8; }
.icon-btn svg { width: 18px; height: 18px; }
.brief-chip { display: flex; align-items: center; gap: 8px; width: 100%; text-align: left; border: 1px dashed var(--line); background: transparent; border-radius: 10px; padding: 8px 12px; font-size: 13px; color: var(--muted); }
.brief-chip b { color: var(--fg); font-weight: 600; white-space: nowrap; }
.brief-chip span { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; min-width: 0; }
.brief-chip.set { border-style: solid; }
.tabs { display: flex; gap: 20px; }
.tabs button { background: none; border: 0; padding: 6px 0 10px; font-size: 14px; font-weight: 600; color: var(--muted); border-bottom: 2px solid transparent; }
.tabs button[aria-selected="true"] { color: var(--fg); border-color: var(--accent); }
.tabs .count { font: 500 11px var(--mono); margin-left: 4px; }

/* panes */
main { flex: 1; min-height: 0; position: relative; }
.pane { position: absolute; inset: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; }
#feed { padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 10px; }
.seg { background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; display: flex; flex-direction: column; gap: 6px; }
.seg .en { font-family: var(--en-font); font-size: calc(var(--size) * .72); line-height: 1.45; color: var(--muted); overflow-wrap: anywhere; }
.seg .ko { font-size: var(--size); line-height: 1.5; font-weight: 600; letter-spacing: -.01em; overflow-wrap: anywhere; }
.seg .ko.wait { color: var(--muted); font-weight: 400; }
.seg .meta { display: flex; align-items: center; gap: 8px; font: 500 10.5px var(--mono); color: var(--muted); letter-spacing: .04em; }
.seg.open { border-color: color-mix(in srgb, var(--live) 55%, var(--line)); background: var(--raise); }
.seg.open .meta::after { content: "말하는 중"; color: var(--live); font-family: var(--ko-font); font-weight: 600; letter-spacing: 0; }
.hide-en .seg .en { display: none; }
.tag { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); }
.tag.ai { color: var(--ai); border-color: color-mix(in srgb, var(--ai) 45%, transparent); }
.w { border-radius: 4px; }
.w.sel { background: color-mix(in srgb, var(--accent) 30%, transparent); color: var(--fg); }
.empty { color: var(--muted); font-size: 15px; line-height: 1.75; padding: 8px 2px; }
.empty b { color: var(--fg); font-weight: 600; }
.empty ol { padding-left: 1.2em; margin: 8px 0 0; }
#jump { position: absolute; left: 50%; transform: translateX(-50%); bottom: 12px; background: var(--accent); color: var(--bg); border: 0; border-radius: 999px; padding: 8px 14px; font-weight: 600; font-size: 13px; box-shadow: 0 6px 18px rgb(0 0 0 / .3); }

/* history */
#historyPane { padding: 14px 16px 28px; display: flex; flex-direction: column; gap: 10px; }
.call { display: flex; flex-direction: column; gap: 6px; text-align: left; width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 12px 14px; }
.call .t { font-size: 16px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.call .m { display: flex; flex-wrap: wrap; gap: 6px 10px; font: 500 11.5px var(--mono); color: var(--muted); }
.call .p { font-size: 13.5px; color: var(--muted); line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.badge { padding: 1px 6px; border-radius: 6px; border: 1px solid var(--line); font-family: var(--ko-font); font-weight: 600; }
.badge.now { color: var(--live); border-color: color-mix(in srgb, var(--live) 50%, var(--line)); }
.foot { margin-top: 8px; padding-top: 14px; border-top: 1px solid var(--line); display: flex; flex-direction: column; gap: 10px; font-size: 12.5px; color: var(--muted); line-height: 1.6; }
.foot .row { display: flex; gap: 8px; flex-wrap: wrap; }

/* call detail */
#detailPane { padding: 12px 16px 32px; display: flex; flex-direction: column; gap: 18px; }
.dhead { display: flex; align-items: center; gap: 8px; }
.back { display: flex; align-items: center; gap: 2px; background: none; border: 0; color: var(--muted); font-size: 14px; font-weight: 600; padding: 6px 4px 6px 0; }
.back svg { width: 18px; height: 18px; }
#dTitle { width: 100%; background: transparent; border: 0; border-bottom: 1px solid var(--line); padding: 4px 0 8px; font-size: 20px; font-weight: 700; color: var(--fg); border-radius: 0; }
.dmeta { font: 500 12px var(--mono); color: var(--muted); margin-top: 6px; }
.actions { display: flex; flex-wrap: wrap; gap: 8px; }
.btn { border: 1px solid var(--line); background: var(--surface); border-radius: 10px; padding: 9px 14px; font-size: 14px; font-weight: 600; text-decoration: none; display: inline-flex; align-items: center; }
.btn.primary { background: var(--accent); color: var(--bg); border-color: var(--accent); }
.btn.danger { color: var(--live); border-color: color-mix(in srgb, var(--live) 45%, var(--line)); }
.btn.danger.armed { background: var(--live); color: #fff; }
.btn:disabled { opacity: .5; }
.sec h3 { margin: 0 0 8px; font: 700 12.5px var(--ko-font); color: var(--muted); }
.sec .body { font-size: 15px; line-height: 1.65; white-space: pre-wrap; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font: 500 13px var(--en-font); padding: 3px 9px; border-radius: 999px; background: var(--raise); border: 1px solid var(--line); }
.facts { display: flex; flex-direction: column; gap: 8px; margin: 0; padding: 0; list-style: none; }
.facts li { font-size: 14px; line-height: 1.5; }
.facts time { font: 500 11px var(--mono); color: var(--muted); margin-right: 6px; }
.facts mark { background: color-mix(in srgb, var(--accent) 25%, transparent); color: var(--fg); border-radius: 3px; padding: 0 2px; }
.tline { display: flex; flex-direction: column; gap: 3px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.tline:last-child { border-bottom: 0; }
.tline .en { font: 14px/1.45 var(--en-font); color: var(--muted); overflow-wrap: anywhere; }
.tline .ko { font-size: 16px; line-height: 1.5; font-weight: 600; overflow-wrap: anywhere; }
.tline time { font: 500 10.5px var(--mono); color: var(--muted); }
#dNote h3.n { font-size: 15.5px; margin: 16px 0 6px; color: var(--accent); font-family: var(--ko-font); letter-spacing: 0; text-transform: none; }
#dNote ul { margin: 0; padding-left: 1.2em; }
#dNote p { margin: 6px 0; }
#dNote { font-size: 15px; line-height: 1.7; overflow-wrap: anywhere; }
.rec { display: flex; flex-direction: column; gap: 6px; }
.rec audio { width: 100%; }
.hint { font-size: 12.5px; color: var(--muted); line-height: 1.55; }

/* dock */
.dock { display: flex; align-items: center; gap: 10px; padding: 12px 16px calc(12px + env(safe-area-inset-bottom, 0px)); border-top: 1px solid var(--line); background: var(--surface); }
.dock .side { height: 52px; min-width: 64px; border-radius: 14px; border: 1px solid var(--line); background: transparent; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; font-size: 11.5px; font-weight: 600; color: var(--muted); padding: 0 10px; }
.dock .side svg { width: 18px; height: 18px; }
.dock .side[aria-pressed="true"] { color: var(--live); border-color: color-mix(in srgb, var(--live) 50%, var(--line)); }
#mic { flex: 1; height: 52px; border-radius: 14px; border: 0; background: var(--accent); color: var(--bg); font-size: 17px; font-weight: 700; display: flex; align-items: center; justify-content: center; gap: 8px; }
#mic.on { background: var(--live); color: #fff; }
#mic svg { width: 20px; height: 20px; stroke-width: 2; }

/* sheets */
.scrim { position: fixed; inset: 0; background: rgb(0 0 0 / .45); z-index: 9; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 10; max-height: 88%; overflow-y: auto; background: var(--surface); border-top: 1px solid var(--line); border-radius: 18px 18px 0 0; padding: 18px 16px calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column; gap: 14px; }
.sheet h2 { margin: 0; font-size: 18px; }
.sheet .close { position: absolute; top: 12px; right: 12px; background: none; border: 0; color: var(--muted); font-size: 26px; line-height: 1; padding: 4px 8px; }
.sheet label { display: flex; flex-direction: column; gap: 6px; font-size: 13px; font-weight: 600; color: var(--muted); }
.sheet input[type=text], .sheet input[type=password], .sheet textarea, .sheet select { background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px; font-size: 16px; font-weight: 400; color: var(--fg); width: 100%; }
.sheet textarea { min-height: 150px; resize: vertical; line-height: 1.5; }
.sheet .hint { font-weight: 400; }
.sheet details { border-top: 1px solid var(--line); padding-top: 12px; }
.sheet summary { font-size: 14px; font-weight: 600; cursor: pointer; }
.sheet details[open] > div { display: flex; flex-direction: column; gap: 14px; margin-top: 14px; }
.row2 { display: flex; gap: 10px; }
.row2 > * { flex: 1; min-width: 0; }
.switch { flex-direction: row !important; align-items: center; justify-content: space-between; }
.switch input { width: 22px; height: 22px; accent-color: var(--accent); }
#wordSheet .word { font: 600 24px var(--en-font); }
#wordSheet .ko { font-size: 20px; font-weight: 700; }
#wordSheet .dict { font-size: 14.5px; color: var(--muted); line-height: 1.7; }
#wordSheet .dict b { color: var(--fg); }
.notice { margin: 10px 16px 0; padding: 10px 12px; border-radius: 10px; border: 1px solid var(--live); font-size: 13.5px; line-height: 1.5; }
#toast { position: fixed; left: 16px; right: 16px; bottom: calc(92px + env(safe-area-inset-bottom, 0px)); z-index: 20; background: var(--fg); color: var(--bg); border-radius: 12px; padding: 10px 14px; font-size: 14px; text-align: center; }
@media (prefers-reduced-motion: reduce) { .dot.on { animation: none; } }
</style>
</head>
<body>
<header>
  <div class="top">
    <span class="brand">Live Translator</span>
    <div class="status"><span class="dot" id="dot"></span><span id="status">대기 중</span></div>
    <button class="icon-btn" id="openSettings" aria-label="설정">
      <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
  </div>
  <button class="brief-chip" id="openBrief"><b>콜 정보</b><span id="briefPreview">콜 이름과 메모를 남겨두면 기록에서 찾기 쉽습니다</span></button>
  <div class="tabs" role="tablist">
    <button role="tab" id="tabLive" aria-selected="true">실시간 자막</button>
    <button role="tab" id="tabHistory" aria-selected="false">기록<span class="count" id="histCount"></span></button>
  </div>
</header>
<div id="notices"></div>
<main>
  <div class="pane" id="livePane">
    <div id="feed">
      <div class="empty" id="empty">
        <b>시작</b>을 누르면 들리는 영어를 받아 적고 바로 아래에 한국어를 띄웁니다. 말하는 동안 카드가 문장 단위로 자라면서 번역도 문장 전체로 다시 다듬어집니다.
        <ol>
          <li>못 알아들은 영어 단어는 <b>탭</b>하면 뜻이 나옵니다.</li>
          <li>모든 콜은 <b>기록</b> 탭에 자동 저장되고, 콜마다 내보내기·삭제할 수 있습니다.</li>
          <li>다음 콜을 할 때는 아래 <b>새 콜</b>을 누르세요.</li>
        </ol>
      </div>
    </div>
    <button id="jump" hidden>최신 자막으로 ↓</button>
  </div>
  <div class="pane" id="historyPane" hidden></div>
  <div class="pane" id="detailPane" hidden></div>
</main>
<div class="dock">
  <button class="side" id="recBtn" aria-pressed="false" aria-label="녹음">
    <svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><circle cx="12" cy="12" r="3.5" fill="currentColor"/></svg>녹음
  </button>
  <button id="mic"><svg viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg><span>시작</span></button>
  <button class="side" id="newCall" aria-label="새 콜">
    <svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span>새 콜</span>
  </button>
</div>

<div class="scrim" id="scrim" hidden></div>

<section class="sheet" id="briefSheet" hidden>
  <button class="close" data-close aria-label="닫기">×</button>
  <h2>콜 정보</h2>
  <label>콜 이름
    <input type="text" id="briefTitle" placeholder="예) ABC Capital 실사 콜">
  </label>
  <label>메모
    <textarea id="brief" placeholder="참석자, 주제, 자주 나올 용어 등. 예) John Smith(CFO), Priya Rao(IR). FY25 EBITDA 조정, 운전자본, 리파이낸싱. TLB, covenant, PIK."></textarea>
    <span class="hint">기록과 내보내기 파일에 함께 저장됩니다. 나중에 API 키를 넣으면 AI 보정의 문맥으로도 쓰입니다.</span>
  </label>
  <button class="btn primary" data-close style="justify-content:center">저장</button>
</section>

<section class="sheet" id="settingsSheet" hidden>
  <button class="close" data-close aria-label="닫기">×</button>
  <h2>설정</h2>
  <label class="switch">영어 원문 표시 <input type="checkbox" id="showEn"></label>
  <div class="row2">
    <label>억양
      <select id="lang">
        <option value="en-US">미국 (EN-US)</option>
        <option value="en-GB">영국 (EN-GB)</option>
        <option value="en-AU">호주 (EN-AU)</option>
        <option value="en-IN">인도 (EN-IN)</option>
      </select>
    </label>
    <label>글자 크기
      <input type="range" id="size" min="15" max="34" step="1">
    </label>
  </div>
  <details>
    <summary>AI 보정 · 콜 노트 (선택, Claude API 유료)</summary>
    <div>
      <label>Claude API 키
        <input type="password" id="apiKey" autocomplete="off" placeholder="sk-ant-...">
        <span class="hint">넣으면 문장마다 Claude가 오인식을 고치고 다시 번역하며, 기록에서 콜 노트를 만들 수 있습니다. 키는 이 기기에만 저장되고 Anthropic API로만 전송됩니다.</span>
      </label>
      <div class="row2">
        <label>실시간 보정
          <select id="liveModel">
            <option value="claude-opus-5-5">Opus 5.5 · 정확</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5 · 균형</option>
            <option value="claude-haiku-5-5">Haiku 5.5 · 빠름</option>
          </select>
        </label>
        <label>콜 노트
          <select id="noteModel">
            <option value="claude-opus-5-5">Opus 5.5</option>
            <option value="claude-sonnet-5-5">Sonnet 5.5</option>
            <option value="claude-haiku-5-5">Haiku 5.5</option>
          </select>
        </label>
      </div>
      <label class="switch">AI 실시간 보정 사용 <input type="checkbox" id="aiOn"></label>
    </div>
  </details>
</section>

<section class="sheet" id="wordSheet" hidden>
  <button class="close" data-close aria-label="닫기">×</button>
  <div class="word" id="wordEn"></div>
  <div class="ko" id="wordKo"></div>
  <div class="dict" id="wordDict"></div>
</section>

<input type="file" id="importFile" accept="application/json,.json" hidden>
<div id="toast" hidden></div>

<script>
const $ = id => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
const isAndroid = /Android/i.test(navigator.userAgent);
const store = {
  get(k, d) { try { const v = localStorage.getItem('lt.' + k); return v === null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('lt.' + k, JSON.stringify(v)); } catch {} },
  del(k) { try { localStorage.removeItem('lt.' + k); } catch {} }
};
const esc = s => String(s ?? '').replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
const pad = n => String(n).padStart(2, '0');
const hhmmss = t => new Date(t).toTimeString().slice(0, 8);
const ymdhm = t => { const d = new Date(t); return `${d.getFullYear()}.${pad(d.getMonth() + 1)}.${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`; };
const fileStamp = t => { const d = new Date(t); return `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}`; };

      const d = r.result;

  delCall: id => idbOK ? req('calls', 'readwrite', s => s.delete(id)) : (memCalls.delete(id), Promise.resolve()),

// ---------- machine translation (free) ----------
const mtCache = new Map();
async function mt(text, dict = false) {
  const key = (dict ? 'd:' : '') + text;
  if (mtCache.has(key)) return mtCache.get(key);
  const url = 'https://translate.googleapis.com/translate_a/single?client=gtx&sl=en&tl=ko&dt=t' + (dict ? '&dt=bd' : '') + '&q=' + encodeURIComponent(text);
  const res = await fetch(url);
  if (!res.ok) throw new Error('mt ' + res.status);
  const j = await res.json();
  const out = { text: (j[0] || []).map(s => s[0]).join(''), dict: dict && Array.isArray(j[1]) ? j[1].map(e => ({ pos: e[0], terms: (e[1] || []).slice(0, 6) })) : [] };
  if (mtCache.size > 400) mtCache.clear();
  mtCache.set(key, out);
  return out;
}
// Per-card throttle: the card's whole text is retranslated at most every MT_GAP ms while it grows,
// so the translation keeps sentence context and never waits for the speaker to stop.
const MT_GAP = 450;
const mtState = new Map();
function requestMT(b, immediate) {
  let st = mtState.get(b.id);
  if (!st) mtState.set(b.id, st = { busy: false, last: 0, timer: null });
  if (st.busy) { st.again = true; return; }
  clearTimeout(st.timer);
  const wait = immediate ? 0 : Math.max(0, MT_GAP - (Date.now() - st.last));
  st.timer = setTimeout(async () => {
    const text = b.raw; if (!text) return;
    st.busy = true; st.last = Date.now(); st.again = false;
    try {
      const r = await mt(text);
      if (b.src !== 'ai') { b.ko = r.text; renderBlock(b); stick(); }
    } catch { if (!b.ko) { b.ko = '(번역 실패 · 인터넷 연결 확인)'; renderBlock(b); } }
    st.busy = false;
    if (st.again || b.raw !== text) requestMT(b, !b.open);
    else if (!b.open) { mtState.delete(b.id); saveCur(); }
  }, wait);
}

// ---------- Claude API (optional, user's own key) ----------
async function claude({ model, system, user, maxTokens = 1024, effort = 'low', onText }) {
  const headers = {
    'content-type': 'application/json', 'x-api-key': cfg.key, 'anthropic-version': '2023-06-01',
    'anthropic-dangerous-direct-browser-access': 'true'
  };
  const body = {
    model, max_tokens: maxTokens, output_config: { effort },
    system: [{ type: 'text', text: system, cache_control: { type: 'ephemeral' } }],
    messages: [{ role: 'user', content: user }]
  };
  const useFallback = model !== 'claude-haiku-5-5';
  if (useFallback) { headers['anthropic-beta'] = 'server-side-fallback-2026-07-01'; body.fallbacks = 'default'; }
  if (onText) body.stream = true;
  const send = () => fetch('https://api.anthropic.com/v1/messages', { method: 'POST', headers, body: JSON.stringify(body) });
  let res = await send();
  if (res.status === 400 && useFallback && /fallback/i.test(await res.clone().text())) {
    delete headers['anthropic-beta']; delete body.fallbacks; res = await send();
  }
  if (!res.ok) {
    let m = ''; try { m = (await res.json()).error?.message || ''; } catch {}
    const e = new Error(m || 'HTTP ' + res.status); e.status = res.status; throw e;
  }
  if (!onText) {
    const j = await res.json();
    if (j.stop_reason === 'refusal') throw new Error('refusal');
    return j.content.filter(b => b.type === 'text').map(b => b.text).join('');
  }
  const reader = res.body.getReader(), dec = new TextDecoder();
  let buf = '', text = '';
  for (;;) {
    const { done, value } = await reader.read();
    if (done) break;
    buf += dec.decode(value, { stream: true });
    let i;
    while ((i = buf.indexOf('\n')) >= 0) {
      const line = buf.slice(0, i).trim(); buf = buf.slice(i + 1);
      if (!line.startsWith('data:')) continue;
      let ev; try { ev = JSON.parse(line.slice(5)); } catch { continue; }
      if (ev.type === 'content_block_delta' && ev.delta?.type === 'text_delta') { text += ev.delta.text; onText(text); }
      else if (ev.type === 'error') throw new Error(ev.error?.message || 'stream error');
    }
  }
  return text;
}
function apiErrorToast(e) {
  if (e.status === 401) toast('API 키가 올바르지 않습니다. 설정에서 확인하세요.', 4000);
  else if (e.status === 429) toast('API 요청이 너무 많습니다. 잠시 후 다시 시도하세요.');
  else if (e.status === 400 && /credit/i.test(e.message)) toast('API 크레딧이 부족합니다.', 4000);
  else toast('AI 처리 실패: ' + e.message.slice(0, 80));
}
const LIVE_SYSTEM = (title, brief) => `You help a Korean professional follow a live English call. You receive one passage at a time of the other party's speech, produced by automatic speech recognition (ASR).

For each new passage:
1. Restore what the speaker most likely said. ASR mishears names, jargon, numbers and homophones, and gives no punctuation. Use the call context and the preceding passages to fix misheard words, then add punctuation and casing. Do not paraphrase, summarize or add content; keep words you cannot confidently fix.
2. Translate the corrected passage into natural, concise Korean as spoken in a business meeting. Keep company names, people's names and numbers exact. When a Korean term would be ambiguous, keep the English term in parentheses, e.g. 약정(covenant).
The passage may stop mid-sentence. Translate exactly what is there without completing the thought.

Reply with only a JSON object and nothing else: {"en": "<corrected English>", "ko": "<Korean translation>"}

Call context written by the listener:
${[title, brief].filter(Boolean).join('\n') || '(none provided)'}`;
let aiInFlight = 0;
async function refine(b) {
  if (!aiReady() || aiInFlight >= 4) return;
  aiInFlight++;
  b.src = 'ai-busy'; renderBlock(b);
  const idx = cur.blocks.indexOf(b);
  const prev = cur.blocks.slice(Math.max(0, idx - 4), idx).map(s => '- ' + (s.en || s.raw)).join('\n');
  try {
    const out = await claude({
      model: cfg.liveModel, system: LIVE_SYSTEM(cur.title, cur.brief), maxTokens: 2000, effort: 'low',
      user: `Preceding passages (context only):\n${prev || '(start of call)'}\n\nNew ASR passage:\n${b.raw}`
    });
    const m = out.match(/\{[\s\S]*\}/);
    const j = m ? JSON.parse(m[0]) : null;
    if (j?.ko) { b.en = (j.en || b.raw).trim(); b.ko = j.ko.trim(); b.src = 'ai'; } else b.src = '';
  } catch (e) { b.src = ''; apiErrorToast(e); }

// ---------- segmentation into cards ----------
// A card grows while the speaker talks and closes at a pause (or when it gets long),
// so each card is roughly one spoken sentence.
const MAX_WORDS = 32, PAUSE_MS = 1200;
const BREAK_BEFORE = new Set(['and', 'but', 'so', 'because', 'which', 'that', 'if', 'when', 'while', 'where', 'although', 'then', 'or', 'whereas', 'since', 'unless', 'now', 'okay', 'right']);
let committed = 0, latestWords = [], pauseTimer = null, openBlock = null;
function pickBreak(words) {
  const hi = Math.min(26, words.length - 4);
  for (let i = hi; i >= 16; i--) if (/[.?!]$/.test(words[i - 1])) return i;
  for (let i = hi; i >= 16; i--) if (/[,;:]$/.test(words[i - 1])) return i;
  for (let i = hi; i >= 16; i--) if (BREAK_BEFORE.has(words[i].toLowerCase())) return i;
  return 24;
}
function setOpen(text) {
  if (!openBlock) {
    openBlock = { id: Date.now() + Math.random(), t: Date.now(), raw: '', en: '', ko: '', src: '', open: true };
    cur.blocks.push(openBlock);
    if (!cur.start) cur.start = openBlock.t;
  }
  if (openBlock.raw === text) return;
  openBlock.raw = text; cur.end = Date.now();
  renderBlock(openBlock); stick(); requestMT(openBlock);
}
function closeBlock() {
  const b = openBlock; if (!b) return;
  openBlock = null; b.open = false;
  renderBlock(b); requestMT(b, true); saveCur(); refine(b);
}
function flush() {
  clearTimeout(pauseTimer);
  const pending = latestWords.slice(committed);
  if (pending.length) { setOpen(pending.join(' ')); committed = latestWords.length; }
  closeBlock();
}
function onResult(e) {
  let full = '', allFinal = true;
  for (let i = 0; i < e.results.length; i++) { full += e.results[i][0].transcript + ' '; if (!e.results[i].isFinal) allFinal = false; }
  latestWords = full.trim().split(/\s+/).filter(Boolean);
  if (latestWords.length < committed) committed = latestWords.length;
  let pending = latestWords.slice(committed);
  while (pending.length >= MAX_WORDS) {
    const n = pickBreak(pending);
    setOpen(pending.slice(0, n).join(' ')); closeBlock();
    committed += n; pending = latestWords.slice(committed);
  }
  if (pending.length) setOpen(pending.join(' '));
  if (allFinal) { flush(); return; }
  clearTimeout(pauseTimer);
  pauseTimer = setTimeout(flush, PAUSE_MS);
}

let rec = null, running = false, wakeLock = null;
function setStatus(t, on) { $('status').textContent = t; $('dot').classList.toggle('on', !!on); }

// ---------- recording ----------
let recorder = null, recChunks = [], recStream = null, recStartedAt = 0;
async function startRecording() {
  try {
    recStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: false, noiseSuppression: false } });
    const mime = ['audio/mp4', 'audio/webm;codecs=opus', 'audio/webm'].find(m => window.MediaRecorder?.isTypeSupported?.(m)) || '';
    recorder = new MediaRecorder(recStream, mime ? { mimeType: mime } : {});
    recChunks = []; recStartedAt = Date.now();
    const callId = cur.id;
    recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
    recorder.onstop = async () => {
      const type = recorder?.mimeType || mime || 'audio/webm';
      const blob = new Blob(recChunks, { type });
      recStream?.getTracks().forEach(t => t.stop()); recStream = null; recorder = null;
      try {
        await db.putAudio({ id: callId + '-' + recStartedAt, callId, t: recStartedAt, type, blob });
        if (cur.id === callId) { cur.hasAudio = true; saveCur(true); }
        else { const c = await db.getCall(callId); if (c) { c.hasAudio = true; await db.putCall(c); } }
        toast('녹음이 이 콜 기록에 저장됐습니다');
      } catch { toast('녹음 저장 실패: 저장 공간이 부족할 수 있습니다', 4000); }
    };
    recorder.start(1000);
  } catch {
    recorder = null; toast('녹음을 시작하지 못했습니다. 자막만 계속합니다.');
  }
}

  const w = e.target.closest('.w'); if (!w) return;
  const word = w.textContent.replace(/^[^\w']+|[^\w']+$/g, '');
  if (!word) return;
  showSheet('wordSheet'); w.classList.add('sel');
  $('wordEn').textContent = word; $('wordKo').textContent = '찾는 중…'; $('wordDict').innerHTML = '';
  try {
    const r = await mt(word.toLowerCase(), true);
    if ($('wordEn').textContent !== word) return;
    $('wordKo').textContent = r.text;
    $('wordDict').innerHTML = r.dict.map(d => `<div><b>${esc(d.pos)}</b> · ${d.terms.map(esc).join(', ')}</div>`).join('');
  } catch { $('wordKo').textContent = '(찾기 실패)'; }
});

// ---------- history ----------
async function renderHistory() {
  const calls = (await db.allCalls()).filter(c => c.blocks.length || c.id === cur.id && (c.title || c.brief)).sort((a, b) => (b.start || b.created) - (a.start || a.created));
  const pane = $('historyPane');
  const items = calls.map(c => {
    const first = c.blocks.find(b => b.ko)?.ko || '';
    const badges = [c.id === cur.id ? '<span class="badge now">현재 콜</span>' : '', c.hasAudio ? '<span class="badge">녹음</span>' : '', c.note ? '<span class="badge">노트</span>' : ''].join('');
    return `<button class="call" data-id="${c.id}">
      <span class="t">${esc(callTitle(c))}</span>
      <span class="m"><span>${ymdhm(c.start || c.created)}</span>${c.start && c.end ? `<span>${dur(c.end - c.start)}</span>` : ''}<span>${c.blocks.length}문장</span>${badges}</span>
      ${first ? `<span class="p">${esc(first)}</span>` : ''}
    </button>`;
  }).join('');
  pane.innerHTML = (items || '<div class="empty">아직 기록이 없습니다. 콜을 시작하면 여기에 자동으로 쌓입니다.</div>') + `
    <div class="foot">
      <div>기록은 이 폰 브라우저 안에만 저장됩니다. 아이폰은 Safari 공유 버튼 → <b>홈 화면에 추가</b>로 열어야 오래 보관되고, 브라우저 데이터를 지우면 함께 지워집니다. 중요한 콜은 내보내기 해두세요.</div>
      <div class="row"><button class="btn" id="backupAll">전체 백업 파일 만들기</button><button class="btn" id="restore">백업 불러오기</button></div>
    </div>`;
  pane.querySelectorAll('.call').forEach(b => b.onclick = () => openDetail(+b.dataset.id));
  $('backupAll').onclick = backupAll;
  $('restore').onclick = () => $('importFile').click();
}

// free, rule-based extraction of figures and names
const NUMWORD = /^(hundred|thousand|million|billion|trillion|percent|percentage|bps|basis|half|quarter|dozen|k|mm|bn)$/i;
function keyFacts(c) {
  const facts = [], names = new Map();
  c.blocks.forEach(b => {
    const words = (b.en || b.raw).split(/\s+/);
    let last = -99;
    words.forEach((w, i) => {
      const clean = w.replace(/[^\w$%.'-]/g, '');
      if ((/\d/.test(clean) || NUMWORD.test(clean) || /[$€£¥%]/.test(w)) && i > last) {
        const a = Math.max(0, i - 5), z = Math.min(words.length, i + 6);
        facts.push({ t: b.t, html: words.slice(a, z).map((x, k) => (a + k === i ? `<mark>${esc(x)}</mark>` : esc(x))).join(' ') });
        last = z;
      }
      if (i > 0 && /^[A-Z][a-zA-Z&'-]{1,}$/.test(clean) && !/^(I|I'm|I'll|I've|I'd|OK|Okay)$/.test(clean) && !/[.?!]$/.test(words[i - 1])) names.set(clean, (names.get(clean) || 0) + 1);
    });
  });
  return { facts: facts.slice(0, 40), names: [...names.entries()].sort((a, b) => b[1] - a[1]).slice(0, 24).map(e => e[0]) };
}
function mdToHTML(md) {
  const inline = s => esc(s).replace(/\*\*(.+?)\*\*/g, '<b>$1</b>');
  let html = '', inList = false;
  for (const raw of md.split('\n')) {
    const line = raw.trimEnd();
    const li = line.match(/^\s*[-*]\s+(.*)/);
    if (li) { if (!inList) { html += '<ul>'; inList = true; } html += `<li>${inline(li[1])}</li>`; continue; }
    if (inList) { html += '</ul>'; inList = false; }
    const h = line.match(/^#{1,4}\s+(.*)/);
    if (h) html += `<h3 class="n">${inline(h[1])}</h3>`;
    else if (line.trim()) html += `<p>${inline(line)}</p>`;
  }
  return html + (inList ? '</ul>' : '');
}
const getCall = async id => id === cur.id ? cur : await db.getCall(id);

async function openDetail(id) {
  const c = await getCall(id); if (!c) return;
  detailId = id; setTab('detail');
  const { facts, names } = keyFacts(c);
  const audios = await db.audioFor(id);
  const pane = $('detailPane');
  pane.innerHTML = `
    <div class="dhead"><button class="back" id="dBack"><svg viewBox="0 0 24 24"><path d="M15 18l-6-6 6-6"/></svg>기록</button></div>
    <div>
      <input id="dTitle" value="${esc(callTitle(c))}" aria-label="콜 이름">
      <div class="dmeta">${ymdhm(c.start || c.created)}${c.start && c.end ? ' · ' + dur(c.end - c.start) : ''} · ${c.blocks.length}문장${c.id === cur.id ? ' · 현재 콜' : ''}</div>
    </div>
    <div class="actions">
      <button class="btn primary" id="dExport">내보내기</button>
      <button class="btn" id="dCopy">복사</button>
      ${c.id !== cur.id ? '<button class="btn" id="dResume">이어서 기록</button>' : ''}
      <button class="btn danger" id="dDelete">삭제</button>
    </div>
    ${c.brief ? `<div class="sec"><h3>메모</h3><div class="body">${esc(c.brief)}</div></div>` : ''}
    <div class="sec"><h3>콜 노트</h3>
      <div id="dNote">${c.note ? mdToHTML(c.note) : `<div class="hint">${hasKey() ? 'Claude가 자막 전체를 읽고 요약·주요 논의·숫자·액션아이템을 한국어로 정리합니다.' : '설정에서 Claude API 키를 넣으면 AI가 콜 노트를 써줍니다. 지금은 아래 자동 추출과 전체 자막을 내보낼 수 있습니다.'}</div>`}</div>
      ${hasKey() ? `<div class="actions" style="margin-top:10px"><button class="btn" id="dNoteBtn">${c.note ? '노트 다시 작성' : 'AI 콜 노트 작성'}</button></div>` : ''}
    </div>
    ${names.length ? `<div class="sec"><h3>자주 나온 이름·고유명사</h3><div class="chips">${names.map(n => `<span class="chip">${esc(n)}</span>`).join('')}</div></div>` : ''}
    ${facts.length ? `<div class="sec"><h3>숫자가 나온 부분</h3><ul class="facts">${facts.map(f => `<li><time>${hhmmss(f.t)}</time>${f.html}</li>`).join('')}</ul></div>` : ''}
    ${audios.length ? `<div class="sec"><h3>녹음</h3>${audios.map((a, i) => `<div class="rec"><audio controls preload="none" data-a="${i}"></audio><div class="actions"><button class="btn" data-dl="${i}">녹음 파일 저장</button></div></div>`).join('')}</div>` : ''}
    <div class="sec"><h3>전체 자막</h3>${c.blocks.map(b => `<div class="tline"><time>${hhmmss(b.t)}</time><div class="en">${esc(b.en || b.raw)}</div><div class="ko">${esc(b.ko)}</div></div>`).join('') || '<div class="hint">자막이 없습니다.</div>'}</div>`;
  pane.scrollTop = 0;

  const urls = audios.map(a => URL.createObjectURL(a.blob));
  pane.querySelectorAll('audio[data-a]').forEach(el => el.src = urls[+el.dataset.a]);
  pane.querySelectorAll('[data-dl]').forEach(b => b.onclick = () => {
    const a = audios[+b.dataset.dl];
    shareOrDownload(a.blob, `${fileName(c)}-${fileStamp(a.t)}.${a.type.includes('mp4') ? 'm4a' : 'webm'}`);
  });
  $('dBack').onclick = () => setTab('history');
  $('dTitle').onchange = async () => { c.title = $('dTitle').value.trim(); if (c === cur) { saveCur(true); renderBriefChip(); } else await db.putCall(c); };
  $('dExport').onclick = () => shareOrDownload(new Blob([exportText(c)], { type: 'text/plain' }), `${fileName(c)}.txt`);
  $('dCopy').onclick = async () => { try { await navigator.clipboard.writeText(exportText(c)); toast('복사했습니다'); } catch { toast('복사하지 못했습니다'); } };
  if ($('dResume')) $('dResume').onclick = async () => {
    if (running) { toast('먼저 정지하세요'); return; }
    saveCur(true); cur = c; store.set('curId', cur.id); renderBriefChip(); renderFeed(); setTab('live'); toast('이 콜에 이어서 기록합니다');
  };
  let armed = false;
  $('dDelete').onclick = async () => {
    if (c === cur && running) { toast('먼저 정지하세요'); return; }
    if (!armed) { armed = true; $('dDelete').classList.add('armed'); $('dDelete').textContent = '한번 더 누르면 삭제'; setTimeout(() => { armed = false; $('dDelete')?.classList.remove('armed'); if ($('dDelete')) $('dDelete').textContent = '삭제'; }, 3000); return; }
    await db.delCall(c.id); await db.delAudioFor(c.id);
    if (c === cur) beginNewCall();
    urls.forEach(u => URL.revokeObjectURL(u));
    updateCount(); setTab('history'); toast('삭제했습니다');
  };
  if ($('dNoteBtn')) $('dNoteBtn').onclick = () => makeNote(c);
}

const fileName = c => `call-${fileStamp(c.start || c.created)}-${callTitle(c).replace(/[\\/:*?"<>|\s]+/g, '_').slice(0, 40)}`;
function exportText(c) {
  const { facts, names } = keyFacts(c);
  const strip = h => h.replace(/<\/?mark>/g, '**').replace(/&amp;/g, '&').replace(/&lt;/g, '<').replace(/&gt;/g, '>').replace(/&quot;/g, '"');
  return [
    `# ${callTitle(c)}`,
    `${ymdhm(c.start || c.created)}${c.start && c.end ? ' · ' + dur(c.end - c.start) : ''} · ${c.blocks.length}문장`,
    c.brief ? `\n## 메모\n${c.brief}` : '',
    c.note ? `\n## 콜 노트\n${c.note}` : '',
    names.length ? `\n## 자주 나온 이름·고유명사\n${names.join(', ')}` : '',
    facts.length ? `\n## 숫자가 나온 부분\n${facts.map(f => `- [${hhmmss(f.t)}] ${strip(f.html)}`).join('\n')}` : '',
    `\n## 전체 자막\n${c.blocks.map(b => `[${hhmmss(b.t)}] ${b.en || b.raw}\n${b.ko}`).join('\n\n')}`,
    '\n— Live Translator'
  ].filter(Boolean).join('\n');
}
async function shareOrDownload(blob, name) {
  try {
    const file = new File([blob], name, { type: blob.type });
    if (navigator.canShare?.({ files: [file] })) { await navigator.share({ files: [file], title: name }); return; }
  } catch (e) { if (e.name === 'AbortError') return; }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob); a.download = name; document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}
async function backupAll() {
  saveCur(true);
  const calls = (await db.allCalls()).filter(c => c.blocks.length);
  if (!calls.length) { toast('백업할 기록이 없습니다'); return; }
  const data = JSON.stringify({ app: 'live-translator', version: 1, exported: Date.now(), calls }, null, 1);
  shareOrDownload(new Blob([data], { type: 'application/json' }), `live-translator-backup-${fileStamp(Date.now())}.json`);
  toast('녹음 파일은 백업에 포함되지 않습니다. 콜마다 따로 저장하세요.', 3500);
}
$('importFile').onchange = async () => {
  const f = $('importFile').files[0]; $('importFile').value = '';
  if (!f) return;
  try {
    const j = JSON.parse(await f.text());
    if (j.app !== 'live-translator' || !Array.isArray(j.calls)) throw new Error();
    for (const c of j.calls) if (c.id && Array.isArray(c.blocks)) await db.putCall(c);
    toast(`${j.calls.length}개 콜을 불러왔습니다`); renderHistory(); updateCount();
  } catch { toast('Live Translator 백업 파일이 아닙니다'); }
};

// ---------- AI call note (optional) ----------
const NOTE_SYSTEM = `You write call notes in Korean for a Korean professional who just finished an English call. The transcript comes from automatic speech recognition of the other party's speech, so it has misheard words, missing punctuation and occasionally the listener's own voice. Infer the intended meaning from context; where something is genuinely unclear, say so rather than guessing.

Write in Korean using this markdown structure:
## 한 줄 요약
## 배경 및 참석자
## 주요 논의
(bullets grouped by topic, concrete and specific)
## 숫자 · 고유명사
(every figure, date, company, person and product mentioned, with what it refers to; keep originals in English)
## 결정 사항
## 액션 아이템
(owner, task, due date if mentioned)
## 후속 질문
(points that were vague or that the listener should confirm)
## 인식이 불확실했던 부분
(short list of transcript passages that may have been misheard, with your best reading)

Omit a section only if there is truly nothing for it. Keep English terms of art in parentheses where helpful.`;
let noteBusy = false;
async function makeNote(c) {
  if (noteBusy || !c.blocks.length) return;
  noteBusy = true; $('dNoteBtn').disabled = true; $('dNoteBtn').textContent = '작성 중…';
  $('dNote').innerHTML = '<div class="hint">자막을 읽고 정리하는 중입니다…</div>';
  try {
    c.note = await claude({
      model: cfg.noteModel, system: NOTE_SYSTEM, maxTokens: 16000, effort: 'medium',
      user: `Call title: ${callTitle(c)}\nListener's notes:\n${c.brief || '(none)'}\n\nTranscript (${c.blocks.length} passages, ${hhmmss(c.blocks[0].t)}–${hhmmss(c.blocks.at(-1).t)}):\n${c.blocks.map(b => `[${hhmmss(b.t)}] ${b.en || b.raw}`).join('\n')}`,
      onText: t => { if (detailId === c.id) $('dNote').innerHTML = mdToHTML(t); }
    });
    c === cur ? saveCur(true) : await db.putCall(c);
  } catch (e) { apiErrorToast(e); }
  noteBusy = false;
  if (detailId === c.id && !$('detailPane').hidden) openDetail(c.id);
}

// ---------- boot ----------
(async () => {
  // carry over the single saved session from the previous version
  const old = store.get('session', null);
  if (old?.segs?.length) {
    const c = newCallObj();
    c.brief = old.brief || ''; c.note = old.note || '';
    c.blocks = old.segs.map(s => ({ id: s.id + Math.random(), t: s.t, raw: s.raw, en: s.en || '', ko: s.ko || '', src: s.src === 'ai' ? 'ai' : '' }));
    c.start = c.blocks[0].t; c.end = c.blocks.at(-1).t; c.id = c.start;
    await db.putCall(c);
  }
  store.del('session');
  const curId = store.get('curId', null);
  cur = (curId && await db.getCall(curId)) || newCallObj();
  cur.blocks.forEach(b => { b.open = false; });
  store.set('curId', cur.id);
  renderBriefChip();
  if (cur.blocks.length) { cur.blocks.forEach(renderBlock); requestAnimationFrame(() => { livePane.scrollTop = livePane.scrollHeight; }); }
  updateCount();
})();
</script>
